name: Build YataiDON Console (Release)

on:
  workflow_dispatch:

jobs:
  build-ps5:
    name: Build for PS5
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PS5_VULKAN_REV: f410e67a0241b3e8edcdbcd2a9b285dfc4a412ed
      PS5_MESA_REV: 1ba9874f478657ccf6da72ce55f0260164cc0bd0
      PS5_SDK_REV: b83202be73e930050e00de0f1b4d9ec46c0391bf
      NATIVE_TEMPLATE_REV: 470695e0c557f99ff2df0e36e4df713c5e636526
      FFMPEG_VERSION: 8.1.2
      FFMPEG_SHA256: 464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c
      OPUS_VERSION: 1.5.2
      OPUS_SHA256: 65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1
      DEPS: ${{ github.workspace }}/.ps5-deps
      BUILD_JOBS: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang clang-19 lld-19 llvm-19-dev libclang-19-dev libclang-cpp19-dev libclc-19-dev \
            libllvmspirvlib-19-dev spirv-tools glslang-tools \
            ninja-build cmake pkg-config make rsync wget unzip xz-utils bison flex \
            python3-mako python3-yaml python3-packaging \
            libgl1-mesa-dev libx11-dev
          pip install --user --break-system-packages 'meson>=1.4'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Mesa's host OpenCL tools must find LLVM 19's llvm-config.
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Cache SDK and RADV
        id: cache-radv
        uses: actions/cache@v4
        with:
          path: |
            .ps5-deps/PS5_Vulkan/.deps/native/ps5-payload-sdk
            .ps5-deps/PS5_Vulkan/.deps/native/radv-release
          key: ps5-radv-${{ env.PS5_VULKAN_REV }}-${{ env.PS5_MESA_REV }}-${{ env.PS5_SDK_REV }}

      - name: Build PS5 payload SDK and RADV
        if: steps.cache-radv.outputs.cache-hit != 'true'
        run: |
          fetch() {
            git init -q "$DEPS/$1"
            git -C "$DEPS/$1" fetch -q --depth 1 "https://github.com/mihawk-99/$1.git" "$2"
            git -C "$DEPS/$1" checkout -q --detach FETCH_HEAD
          }
          fetch PS5_Vulkan "$PS5_VULKAN_REV"
          fetch PS5_Mesa "$PS5_MESA_REV"
          fetch PS5_PayloadSDK "$PS5_SDK_REV"
          mkdir -p "$DEPS/PS5_Vulkan/.deps/native/zlib"
          wget -q --tries=3 -O "$DEPS/PS5_Vulkan/.deps/native/zlib/zlib-1.3.2.tar.gz" \
            https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.gz
          bash "$DEPS/PS5_Vulkan/tools/setup-native-dependencies.sh"
          bash "$DEPS/PS5_Vulkan/tools/build-radv.sh" release

      - name: Set PS5 paths
        run: |
          echo "PS5_PAYLOAD_SDK=$DEPS/PS5_Vulkan/.deps/native/ps5-payload-sdk" >> "$GITHUB_ENV"
          echo "PS5_VULKAN_PREFIX=$DEPS/PS5_Vulkan/.deps/native/radv-release" >> "$GITHUB_ENV"
          echo "PS5_OPUS_PREFIX=$DEPS/opus-ps5" >> "$GITHUB_ENV"
          echo "PS5_FFMPEG_PREFIX=$DEPS/ffmpeg-ps5" >> "$GITHUB_ENV"

      - name: Cache FFmpeg and Opus
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            .ps5-deps/opus-ps5
            .ps5-deps/ffmpeg-ps5
          key: ps5-ffmpeg-${{ env.FFMPEG_VERSION }}-opus-${{ env.OPUS_VERSION }}-${{ env.PS5_SDK_REV }}-${{ hashFiles('platform/ps5/build-ffmpeg.sh', 'platform/ps5/build-opus.sh') }}

      - name: Build Opus and FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          cd "$DEPS"
          wget -q "https://downloads.xiph.org/releases/opus/opus-$OPUS_VERSION.tar.gz"
          wget -q "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          printf '%s  %s\n' "$OPUS_SHA256" "opus-$OPUS_VERSION.tar.gz" "$FFMPEG_SHA256" "ffmpeg-$FFMPEG_VERSION.tar.xz" | sha256sum -c --strict
          tar -xzf "opus-$OPUS_VERSION.tar.gz"
          tar -xJf "ffmpeg-$FFMPEG_VERSION.tar.xz"
          OPUS_SOURCE="$DEPS/opus-$OPUS_VERSION" OPUS_BUILD_DIR="$DEPS/build-opus" \
            bash "$GITHUB_WORKSPACE/platform/ps5/build-opus.sh"
          FFMPEG_SOURCE="$DEPS/ffmpeg-$FFMPEG_VERSION" FFMPEG_BUILD_DIR="$DEPS/build-ffmpeg" \
            bash "$GITHUB_WORKSPACE/platform/ps5/build-ffmpeg.sh"

      - name: Prepare native-app template
        run: |
          t=platform/ps5/vendor/native-template
          git init -q "$t"
          git -C "$t" fetch -q --depth 1 https://github.com/drakmor/ps5-native-app-boilerplate.git "$NATIVE_TEMPLATE_REV"
          git -C "$t" checkout -q --detach FETCH_HEAD
          # Regenerates the clean-room libc.prx (checksum-verified) and host zlib.
          bash "$t/tools/rebuild-libc.sh"

      - name: Build
        run: bash platform/ps5/build-game.sh

      - name: Package
        run: |
          python3 platform/ps5/package.py --skip-media
          mkdir -p release
          cp platform/ps5/dist/YataiDON-PS5-experimental.zip release/YataiDON-PS5.zip

      - name: Upload PS5 package
        uses: actions/upload-artifact@v4
        with:
          name: YataiDON-PS5
          path: release/
          compression-level: 0
          if-no-files-found: error

  build-switch:
    name: Build for Switch
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: devkitpro/devkita64:latest
      options: --user root
    env:
      MESA_SWITCH_REV: 0ff52079ca9e9e837ed27eb95a8d239f439a1864
      SPIRV_TAG: vulkan-sdk-1.3.290.0
      DEPS: /opt/switch-deps
      CARGO_HOME: /root/.cargo
      RUSTUP_HOME: /root/.rustup
      MESA_SWITCH_RUST_TARGET: aarch64-unknown-linux-gnu
      BUILD_JOBS: 4

    steps:
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config patch zip \
            flex bison curl ca-certificates git xz-utils \
            clang libclang-dev llvm-15-dev libclang-15-dev libclang-common-15-dev \
            libclc-15-dev libllvmspirvlib-15-dev \
            python3-pip python3-setuptools python3-wheel \
            libgl-dev libx11-dev
          pip3 install --break-system-packages --no-cache-dir meson mako pyyaml packaging

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Restore mesa-switch SDK
        id: cache-mesa
        uses: actions/cache/restore@v4
        with:
          path: /opt/switch-deps/mesa-sdk
          key: switch-mesa-${{ env.MESA_SWITCH_REV }}-o3

      # Mirrors mesa-switch's own CI (.github/workflows/build.yml) at the pinned revision.
      - name: Build mesa-switch SDK
        if: steps.cache-mesa.outputs.cache-hit != 'true'
        run: |
          mesa="$DEPS/mesa-switch"
          git init -q "$mesa"
          git -C "$mesa" fetch -q --depth 1 https://github.com/danfromtico/mesa-switch.git "$MESA_SWITCH_REV"
          git -C "$mesa" checkout -q --detach FETCH_HEAD
          cd "$mesa"

          if dkp-pacman -Q switch-mesa >/dev/null 2>&1; then
            dkp-pacman -Rdd --noconfirm switch-mesa
          fi
          dkp-pacman -S --noconfirm --needed switch-pkg-config switch-zlib switch-libzstd switch-libexpat switch-libdrm_nouveau

          git clone -q --depth 1 --branch "$SPIRV_TAG" https://github.com/KhronosGroup/SPIRV-Tools.git /tmp/spirv
          git clone -q --depth 1 --branch "$SPIRV_TAG" https://github.com/KhronosGroup/SPIRV-Headers.git /tmp/spirv/external/spirv-headers
          cmake -S /tmp/spirv -B /tmp/spirv/build -G Ninja -DCMAKE_INSTALL_PREFIX=/opt/spirv-tools \
            -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON
          cmake --build /tmp/spirv/build
          cmake --install /tmp/spirv/build

          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain nightly --profile minimal
          export PATH="$CARGO_HOME/bin:$PATH"
          rustup component add rust-src
          rustup target add "$MESA_SWITCH_RUST_TARGET"
          cargo install bindgen-cli cbindgen

          mkdir -p /usr/local/libexec
          install -m 755 bindgen-switch-wrapper.sh /usr/local/libexec/bindgen
          install -m 755 rustc-switch-wrapper.sh /usr/local/libexec/rustc
          install -m 644 bindgen-atomic-shim.h /usr/local/libexec/bindgen-atomic-shim.h
          install -m 644 src/nouveau/headers/nv_device_info.h "$DEVKITPRO/portlibs/switch/include/"

          # Rust std links -lrt -ldl -lutil; Mesa's rust_switch_stubs.c provides the symbols.
          lib="$DEVKITPRO/portlibs/switch/lib"
          echo 'void __mesa_switch_stub_lib(void) {}' > /tmp/stub_posix.c
          "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-gcc" -c /tmp/stub_posix.c -o /tmp/stub_posix.o
          for l in dl rt util; do
            [ -f "$lib/lib$l.a" ] || "$DEVKITPRO/devkitA64/bin/aarch64-none-elf-ar" rcs "$lib/lib$l.a" /tmp/stub_posix.o
          done

          # Mesa looks up Clang's OpenCL headers by full and major LLVM version.
          libdir="$(llvm-config-15 --libdir)"
          version="$(llvm-config-15 --version)"
          major="${version%%.*}"
          [ -e "$libdir/clang/$version" ] || ln -sfn "$major" "$libdir/clang/$version"
          [ -e "$libdir/clang/$major" ] || ln -sfn "$version" "$libdir/clang/$major"
          printf "[binaries]\nllvm-config = '/usr/bin/llvm-config-15'\n" > llvm-native.txt

          PKG_CONFIG_PATH=/opt/spirv-tools/lib/pkgconfig CMAKE_PREFIX_PATH=/opt/spirv-tools \
          meson setup builddir-native --native-file llvm-native.txt --buildtype=release \
            -Dvulkan-drivers= -Dgallium-drivers= -Dshader-cache=enabled -Dplatforms= \
            -Dglx=disabled -Degl=disabled -Dopengl=false -Dgles1=disabled -Dgles2=disabled \
            -Dtools=[] -Dllvm=enabled -Dmesa-clc=enabled -Dmesa-clc-bundle-headers=enabled \
            -Dprecomp-compiler=enabled -Dinstall-mesa-clc=true
          ninja -C builddir-native src/compiler/clc/mesa_clc src/compiler/spirv/vtn_bindgen2
          export PATH="$PWD/builddir-native/src/compiler/clc:$PWD/builddir-native/src/compiler/spirv:$PATH"

          # optimization=3: the game cannot raise the driver's optimization later.
          meson setup builddir-switch --cross-file switch_cross_file.txt \
            --default-library=static --prefix=/opt/devkitpro/portlibs/switch --libdir=lib \
            --buildtype=release -Doptimization=3 -Db_lto=false -Db_ndebug=true \
            -Dvulkan-drivers=nouveau -Dgallium-drivers=nouveau,zink -Dgallium-rusticl=false \
            -Dplatforms=switch -Degl-native-platform=switch -Dglx=disabled -Degl=enabled \
            -Dopengl=true -Dgles1=enabled -Dgles2=enabled -Dvideo-codecs= \
            -Dshader-cache=enabled -Dxmlconfig=enabled -Dexpat=enabled -Dtools=[] \
            -Dllvm=disabled -Dshared-glapi=disabled -Dshared-llvm=disabled \
            -Dmesa-clc=system -Dprecomp-compiler=system -Dcpp_rtti=false \
            -Dbuild-tests=false -Dnvk-build-id="$MESA_SWITCH_REV"
          ninja -C builddir-switch
          meson install -C builddir-switch --destdir "$DEPS/mesa-install"
          mv "$DEPS/mesa-install/opt/devkitpro/portlibs/switch" "$DEPS/mesa-sdk"
          cp -rn include/vulkan include/vk_video "$DEPS/mesa-sdk/include/"
          test -f "$DEPS/mesa-sdk/lib/libvulkan.a"

      # Saved immediately: actions/cache only saves on job success, and Mesa takes the longest.
      - name: Save mesa-switch SDK
        if: steps.cache-mesa.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /opt/switch-deps/mesa-sdk
          key: ${{ steps.cache-mesa.outputs.cache-primary-key }}

      - name: Restore media libraries
        id: cache-media
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/switch-deps/media/lib
            /opt/switch-deps/media/iconv/include/iconv.h
          key: switch-media-${{ hashFiles('platform/switch/build-o3-media.sh', 'platform/switch/prepare-o3-media.py') }}

      - name: Build FFmpeg and libiconv
        if: steps.cache-media.outputs.cache-hit != 'true'
        run: YATAIDON_MEDIA_WORKDIR="$DEPS/media" bash platform/switch/build-o3-media.sh

      - name: Save media libraries
        if: steps.cache-media.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            /opt/switch-deps/media/lib
            /opt/switch-deps/media/iconv/include/iconv.h
          key: ${{ steps.cache-media.outputs.cache-primary-key }}

      - name: Build host shaderc
        run: |
          python3 platform/switch/prepare-game.py
          cmake -S platform/switch/vendor/bgfx.cmake -B build-host-bgfx -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DBGFX_WITH_WAYLAND=OFF -DBGFX_BUILD_EXAMPLES=OFF -DBGFX_BUILD_TESTS=OFF -DBGFX_BUILD_TOOLS=ON \
            -DBGFX_BUILD_TOOLS_TEXTURE=OFF -DBGFX_BUILD_TOOLS_GEOMETRY=OFF -DBGFX_BUILD_TOOLS_BIN2C=OFF
          cmake --build build-host-bgfx --target shaderc --parallel "$BUILD_JOBS"

      - name: Build
        run: |
          export YATAIDON_SHADERC="$GITHUB_WORKSPACE/build-host-bgfx/cmake/bgfx/shaderc"
          export SWITCH_MESA_PREFIX="$DEPS/mesa-sdk"
          export YATAIDON_MEDIA_LIBRARY_DIR="$DEPS/media/lib"
          # The game finds GNU libiconv through portlibs; the image ships none.
          cp "$DEPS/media/lib/libiconv.a" "$DEVKITPRO/portlibs/switch/lib/"
          cp "$DEPS/media/iconv/include/iconv.h" "$DEVKITPRO/portlibs/switch/include/"
          bash platform/switch/build-game.sh

      - name: Package
        run: |
          mkdir -p release/stage/switch/YataiDON
          cp platform/switch/build/YataiDON.nro release/stage/switch/YataiDON/
          cd release/stage && zip -r ../YataiDON-Switch.zip switch

      - name: Upload Switch package
        uses: actions/upload-artifact@v4
        with:
          name: YataiDON-Switch
          path: release/YataiDON-Switch.zip
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [build-ps5, build-switch]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Download PS5 artifact
        uses: actions/download-artifact@v4
        with:
          name: YataiDON-PS5
          path: ps5-out/

      - name: Download Switch artifact
        uses: actions/download-artifact@v4
        with:
          name: YataiDON-Switch
          path: switch-out/

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ps5-out/YataiDON-PS5.zip
            switch-out/YataiDON-Switch.zip
          name: "YataiDON [Latest Release]"
          tag_name: "latest"
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}
