name: Build YataiDON Desktop (Release)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-26.04
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Configure Git credentials
        run: |
          git config --global url."https://${{ secrets.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}@ese.tjadataba.se/".insteadOf "https://ese.tjadataba.se/"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ccache \
            ninja-build \
            pkg-config \
            patchelf \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libjack-dev \
            liblua5.4-dev \
            libavcodec-dev \
            libavformat-dev \
            libavutil-dev \
            libswscale-dev \
            libswresample-dev \
            libavfilter-dev \
            libavdevice-dev \
            libogg-dev \
            libvorbis-dev \
            libflac-dev \
            libopus-dev \
            libmp3lame-dev \
            libmpg123-dev \
            libspeex-dev \
            libdw-dev

      - name: Setup SDL3
        id: sdl
        uses: libsdl-org/setup-sdl@main
        with:
          install-linux-dependencies: true
          version: 3-head
          build-type: Release

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DNETWORK_URL="${{ secrets.NETWORK_URL }}" \
            -DNETWORK_AUTH_KEY="${{ secrets.NETWORK_AUTH_KEY }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare release package
        run: |
          mkdir -p release/YataiDON-Linux
          cp build/bin/YataiDON release/YataiDON-Linux/
          cp -r shader release/YataiDON-Linux/
          cp -r Songs release/YataiDON-Linux/
          cp update.sh release/YataiDON-Linux/
          chmod +x release/YataiDON-Linux/YataiDON release/YataiDON-Linux/update.sh

          # Bundle FFmpeg shared libraries into lib/
          mkdir -p release/YataiDON-Linux/lib
          ldd build/bin/YataiDON | grep -E "(libav|libsw).*=>" | awk '{print $3}' | \
            xargs -I{} cp -L {} release/YataiDON-Linux/lib/

          # Bundle sndfile codec dependencies (ogg, vorbis, FLAC, opus, mp3, etc.)
          ldd build/bin/YataiDON | grep -E "(libsndfile|libogg|libvorbis|libFLAC|libopus|libmp3lame|libmpg123|libspeex).*=>" | awk '{print $3}' | \
            grep -v "^$" | xargs -I{} cp -L {} release/YataiDON-Linux/lib/ 2>/dev/null || true

          # Bundle SDL3 shared library
          ldd build/bin/YataiDON | grep -E "libSDL3.*=>" | awk '{print $3}' | \
            grep -v "^$" | xargs -I{} cp -L {} release/YataiDON-Linux/lib/ 2>/dev/null || true

          # Bundle transitive deps of FFmpeg AND sndfile codec libs
          for so in release/YataiDON-Linux/lib/lib{av,sw,ogg,vorbis,FLAC,opus,mp3lame,mpg123,speex,SDL3}*.so*; do
            ldd "$so" 2>/dev/null | grep "=>" | awk '{print $3}' | grep -v "^$" | \
              grep -vE "lib(c\.so|m\.so|dl\.so|rt\.so|resolv\.so|nsl\.so|util\.so|anl\.so|pthread\.so|gcc_s\.so|stdc\+\+\.so|X11\.so|GL\.so|asound\.so|pulse\.so|jack\.so|Xi\.so|Xrandr\.so|xcb)" | \
              grep -v "ld-linux" | \
              xargs -I{} cp -L {} release/YataiDON-Linux/lib/ 2>/dev/null || true
          done

          # Patch rpath: binary looks in $ORIGIN/lib, bundled .so files look in $ORIGIN
          patchelf --set-rpath '$ORIGIN/lib' release/YataiDON-Linux/YataiDON
          for so in release/YataiDON-Linux/lib/*.so*; do
            [ -f "$so" ] && patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

          # Checksums — binary + updater + shader + lib
          (
            cd release/YataiDON-Linux
            sha256sum YataiDON update.sh
            find shader -type f | sort | xargs sha256sum
            [ -d lib ] && find lib -type f | sort | xargs sha256sum || true
          ) > release/YataiDON-Linux/checksums-linux.sha256

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: YataiDON-Linux
          path: release/YataiDON-Linux/
          include-hidden-files: true
          if-no-files-found: error

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git credentials
        shell: bash
        run: |
          git config --global url."https://${{ secrets.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}@ese.tjadataba.se/".insteadOf "https://ese.tjadataba.se/"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cppwinrt
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ccache
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-ffmpeg
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-libidn2
            mingw-w64-x86_64-opus
            git
            make

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DNETWORK_URL="${{ secrets.NETWORK_URL }}" \
            -DNETWORK_AUTH_KEY="${{ secrets.NETWORK_AUTH_KEY }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare release package
        shell: bash
        run: |
          mkdir -p release/YataiDON-Windows
          cp build/bin/YataiDON.exe release/YataiDON-Windows/
          cp build/bin/*.dll release/YataiDON-Windows/ 2>/dev/null || true
          cp -r shader release/YataiDON-Windows/
          cp -r Songs release/YataiDON-Windows/
          cp update.ps1 update.bat release/YataiDON-Windows/

          # Checksums — binary + updater + dlls + shader
          (
            cd release/YataiDON-Windows
            sha256sum YataiDON.exe update.ps1 update.bat
            find shader -type f | sort | xargs sha256sum
            find . -maxdepth 1 -name "*.dll" | sort | xargs sha256sum
          ) > release/YataiDON-Windows/checksums-windows.sha256

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: YataiDON-Windows
          include-hidden-files: true
          path: release/YataiDON-Windows/
          if-no-files-found: error

  build-macos:
    name: Build on macOS
    runs-on: macos-26
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 500M

    steps:
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Configure Git credentials
        run: |
          git config --global credential.helper ""
          git config --global url."https://${{ secrets.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}@ese.tjadataba.se/".insteadOf "https://ese.tjadataba.se/"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        run: |
          brew install \
            cmake \
            ccache \
            ninja \
            pkg-config \
            ffmpeg \
            sdl3 \
            dylibbundler \
            libogg \
            libvorbis \
            flac \
            opus \
            lame \
            mpg123 \
            speex \
            libsndfile \
            libidn2

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ runner.os }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Configure CMake
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$(brew --prefix)/lib" \
            -DNETWORK_URL="${{ secrets.NETWORK_URL }}" \
            -DNETWORK_AUTH_KEY="${{ secrets.NETWORK_AUTH_KEY }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare release package
        run: |
          mkdir -p release/YataiDON-macOS
          cp build/bin/YataiDON release/YataiDON-macOS/
          cp -r shader release/YataiDON-macOS/
          cp -r Songs release/YataiDON-macOS/
          cp update.sh release/YataiDON-macOS/
          chmod +x release/YataiDON-macOS/YataiDON release/YataiDON-macOS/update.sh

          # Bundle non-system dylib dependencies
          mkdir -p release/YataiDON-macOS/lib
          dylibbundler -od -b \
            -x release/YataiDON-macOS/YataiDON \
            -d release/YataiDON-macOS/lib \
            -p @executable_path/lib

          # Checksums — binary + updater + shader + lib
          (
            cd release/YataiDON-macOS
            shasum -a 256 YataiDON update.sh
            find shader -type f | sort | xargs shasum -a 256
            [ -d lib ] && find lib -type f | sort | xargs shasum -a 256 || true
          ) > release/YataiDON-macOS/checksums-macos.sha256

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: YataiDON-macOS
          include-hidden-files: true
          path: release/YataiDON-macOS/
          if-no-files-found: error

  build-ps5:
    name: Build for PS5
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PS5_VULKAN_REV: f410e67a0241b3e8edcdbcd2a9b285dfc4a412ed
      PS5_MESA_REV: 1ba9874f478657ccf6da72ce55f0260164cc0bd0
      PS5_SDK_REV: b83202be73e930050e00de0f1b4d9ec46c0391bf
      NATIVE_TEMPLATE_REV: 470695e0c557f99ff2df0e36e4df713c5e636526
      FFMPEG_VERSION: 8.1.2
      FFMPEG_SHA256: 464beb5e7bf0c311e68b45ae2f04e9cc2af88851abb4082231742a74d97b524c
      OPUS_VERSION: 1.5.2
      OPUS_SHA256: 65c1d2f78b9f2fb20082c38cbe47c951ad5839345876e46941612ee87f9a7ce1
      DEPS: ${{ github.workspace }}/.ps5-deps
      BUILD_JOBS: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang clang-19 lld-19 llvm-19-dev libclang-19-dev libclang-cpp19-dev libclc-19-dev \
            libllvmspirvlib-19-dev spirv-tools glslang-tools \
            ninja-build cmake pkg-config make rsync wget unzip xz-utils bison flex \
            python3-mako python3-yaml python3-packaging \
            libgl1-mesa-dev libx11-dev
          pip install --user --break-system-packages 'meson>=1.4'
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # Mesa's host OpenCL tools must find LLVM 19's llvm-config.
          echo "/usr/lib/llvm-19/bin" >> "$GITHUB_PATH"

      - name: Cache SDK and RADV
        id: cache-radv
        uses: actions/cache@v4
        with:
          path: |
            .ps5-deps/PS5_Vulkan/.deps/native/ps5-payload-sdk
            .ps5-deps/PS5_Vulkan/.deps/native/radv-release
          key: ps5-radv-${{ env.PS5_VULKAN_REV }}-${{ env.PS5_MESA_REV }}-${{ env.PS5_SDK_REV }}

      - name: Build PS5 payload SDK and RADV
        if: steps.cache-radv.outputs.cache-hit != 'true'
        run: |
          fetch() {
            git init -q "$DEPS/$1"
            git -C "$DEPS/$1" fetch -q --depth 1 "https://github.com/mihawk-99/$1.git" "$2"
            git -C "$DEPS/$1" checkout -q --detach FETCH_HEAD
          }
          fetch PS5_Vulkan "$PS5_VULKAN_REV"
          fetch PS5_Mesa "$PS5_MESA_REV"
          fetch PS5_PayloadSDK "$PS5_SDK_REV"
          bash "$DEPS/PS5_Vulkan/tools/setup-native-dependencies.sh"
          bash "$DEPS/PS5_Vulkan/tools/build-radv.sh" release

      - name: Set PS5 paths
        run: |
          echo "PS5_PAYLOAD_SDK=$DEPS/PS5_Vulkan/.deps/native/ps5-payload-sdk" >> "$GITHUB_ENV"
          echo "PS5_VULKAN_PREFIX=$DEPS/PS5_Vulkan/.deps/native/radv-release" >> "$GITHUB_ENV"
          echo "PS5_OPUS_PREFIX=$DEPS/opus-ps5" >> "$GITHUB_ENV"
          echo "PS5_FFMPEG_PREFIX=$DEPS/ffmpeg-ps5" >> "$GITHUB_ENV"

      - name: Cache FFmpeg and Opus
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            .ps5-deps/opus-ps5
            .ps5-deps/ffmpeg-ps5
          key: ps5-ffmpeg-${{ env.FFMPEG_VERSION }}-opus-${{ env.OPUS_VERSION }}-${{ env.PS5_SDK_REV }}-${{ hashFiles('ps5/build-ffmpeg.sh', 'ps5/build-opus.sh') }}

      - name: Build Opus and FFmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          cd "$DEPS"
          wget -q "https://downloads.xiph.org/releases/opus/opus-$OPUS_VERSION.tar.gz"
          wget -q "https://ffmpeg.org/releases/ffmpeg-$FFMPEG_VERSION.tar.xz"
          printf '%s  %s\n' "$OPUS_SHA256" "opus-$OPUS_VERSION.tar.gz" "$FFMPEG_SHA256" "ffmpeg-$FFMPEG_VERSION.tar.xz" | sha256sum -c --strict
          tar -xzf "opus-$OPUS_VERSION.tar.gz"
          tar -xJf "ffmpeg-$FFMPEG_VERSION.tar.xz"
          OPUS_SOURCE="$DEPS/opus-$OPUS_VERSION" OPUS_BUILD_DIR="$DEPS/build-opus" \
            bash "$GITHUB_WORKSPACE/ps5/build-opus.sh"
          FFMPEG_SOURCE="$DEPS/ffmpeg-$FFMPEG_VERSION" FFMPEG_BUILD_DIR="$DEPS/build-ffmpeg" \
            bash "$GITHUB_WORKSPACE/ps5/build-ffmpeg.sh"

      - name: Prepare native-app template
        run: |
          t=ps5/vendor/native-template
          git init -q "$t"
          git -C "$t" fetch -q --depth 1 https://github.com/drakmor/ps5-native-app-boilerplate.git "$NATIVE_TEMPLATE_REV"
          git -C "$t" checkout -q --detach FETCH_HEAD
          # Regenerates the clean-room libc.prx (checksum-verified) and host zlib.
          bash "$t/tools/rebuild-libc.sh"

      - name: Build
        run: bash ps5/build-game.sh

      - name: Package
        run: |
          python3 ps5/package.py --skip-media
          python3 ps5/tools/verify-bundle.py
          mkdir -p release
          cp ps5/dist/YataiDON-PS5-experimental.zip release/YataiDON-PS5.zip
          (cd release && sha256sum YataiDON-PS5.zip > checksums-ps5.sha256)

      - name: Upload PS5 package
        uses: actions/upload-artifact@v4
        with:
          name: YataiDON-PS5
          path: release/
          compression-level: 0
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows, build-macos, build-ps5]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Configure Git credentials
        run: |
          git config --global url."https://${{ secrets.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}@ese.tjadataba.se/".insteadOf "https://ese.tjadataba.se/"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Get skin heads
        id: skins
        run: |
          for s in PyTaikoGreen YataiDONRed YataiDONNijiiro; do
            echo "$s=$(git ls-remote https://ese.tjadataba.se/Yonokid/$s.git HEAD | cut -f1)" >> "$GITHUB_OUTPUT"
          done

      - name: Cache skins
        id: cache-skins
        uses: actions/cache@v4
        with:
          path: |
            Skins/PyTaikoGreen
            Skins/YataiDONRed
            Skins/YataiDONNijiiro
          key: skins-${{ steps.skins.outputs.PyTaikoGreen }}-${{ steps.skins.outputs.YataiDONRed }}-${{ steps.skins.outputs.YataiDONNijiiro }}

      - name: Clone skins
        if: steps.cache-skins.outputs.cache-hit != 'true'
        run: |
          for s in PyTaikoGreen YataiDONRed YataiDONNijiiro; do
            git clone --depth 1 https://ese.tjadataba.se/Yonokid/$s.git Skins/$s
          done

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: YataiDON-Linux
          path: linux/

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: YataiDON-Windows
          path: windows/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: YataiDON-macOS
          path: macos/

      - name: Download PS5 artifact
        uses: actions/download-artifact@v4
        with:
          name: YataiDON-PS5
          path: ps5-release/

      - name: Package release assets
        run: |
          # Skins are bundled here, not in the build jobs (the binary doesn't need them to compile)
          # Drop each skin's .git (a full pack of the content, doubles the zip past GitHub's 2 GiB asset limit)
          for d in linux windows macos; do
            cp -r Skins $d/
            find $d/Skins -maxdepth 2 -name .git -prune -exec rm -rf {} +
          done

          # Full zips for manual download
          (cd linux   && zip -r ../YataiDON-Linux.zip .)
          (cd windows && zip -r ../YataiDON-Windows.zip .)
          (cd macos   && zip -r ../YataiDON-macOS.zip .)

          # Metadata files
          cp linux/checksums-linux.sha256     ./checksums-linux.sha256
          cp windows/checksums-windows.sha256 ./checksums-windows.sha256
          cp macos/checksums-macos.sha256     ./checksums-macos.sha256

          # Linux update package: binary + updater + shader + lib
          UPDATE_LINUX="YataiDON update.sh shader/"
          [ -d linux/lib ] && UPDATE_LINUX="$UPDATE_LINUX lib/"
          tar -czf update-linux.tar.gz -C linux $UPDATE_LINUX

          # Windows update package: binary + updater + dlls + shader
          UPDATE_WIN="YataiDON.exe update.ps1 update.bat shader/"
          for dll in windows/*.dll; do
            [ -f "$dll" ] && UPDATE_WIN="$UPDATE_WIN $(basename "$dll")"
          done
          tar -czf update-windows.tar.gz -C windows $UPDATE_WIN

          # macOS update package: binary + updater + shader + lib
          UPDATE_MACOS="YataiDON update.sh shader/"
          [ -d macos/lib ] && UPDATE_MACOS="$UPDATE_MACOS lib/"
          tar -czf update-macos.tar.gz -C macos $UPDATE_MACOS

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            YataiDON-Linux.zip
            YataiDON-Windows.zip
            YataiDON-macOS.zip
            update-linux.tar.gz
            update-windows.tar.gz
            update-macos.tar.gz
            ps5-release/YataiDON-PS5.zip
            checksums-linux.sha256
            checksums-windows.sha256
            checksums-macos.sha256
            ps5-release/checksums-ps5.sha256
          name: "YataiDON [Latest Release]"
          tag_name: "latest"
          make_latest: true
          token: ${{ secrets.GITHUB_TOKEN }}

