name: Build YataiDON (Debug)

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-26.04

    steps:
      - name: Configure Git credentials
        run: |
          git config --global url."https://${{ secrets.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}@ese.tjadataba.se/".insteadOf "https://ese.tjadataba.se/"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clone skins
        run: |
          for s in PyTaikoGreen YataiDONRed YataiDONNijiiro; do
            git clone --depth 1 https://ese.tjadataba.se/Yonokid/$s.git Skins/$s
          done

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            pkg-config \
            patchelf \
            libx11-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxcursor-dev \
            libxi-dev \
            libxtst-dev \
            libgl1-mesa-dev \
            libasound2-dev \
            libpulse-dev \
            libjack-dev \
            libunwind-dev \
            libusb-1.0-0-dev \
            libxss-dev \
            liblua5.4-dev \
            libmp3lame-dev \
            libmpg123-dev \
            libdw-dev \
            nasm \
            libxext-dev \
            libxfixes-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libgles2-mesa-dev \
            libdbus-1-dev \
            libibus-1.0-dev \
            libudev-dev \
            libpipewire-0.3-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            liburing-dev

      - name: Cache static FFmpeg
        uses: actions/cache@v4
        with:
          path: .linux-ffmpeg
          key: ffmpeg-linux-${{ hashFiles('tools/build_ffmpeg_linux.sh') }}

      - name: Build static FFmpeg
        run: test -d .linux-ffmpeg/lib || bash tools/build_ffmpeg_linux.sh

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DYATAIDON_STATIC_DEPS=ON \
            -DYATAIDON_FFMPEG_PREFIX="$PWD/.linux-ffmpeg" \
            -DNETWORK_URL="${{ secrets.NETWORK_URL }}" \
            -DNETWORK_AUTH_KEY="${{ secrets.NETWORK_AUTH_KEY }}"

      - name: Build
        run: cmake --build build --config Debug

      - name: Prepare release package
        run: |
          mkdir -p release/YataiDON-Linux
          cp build/bin/YataiDON release/YataiDON-Linux/
          cp -r Skins release/YataiDON-Linux/
          cp -r shader release/YataiDON-Linux/
          cp -r Songs release/YataiDON-Linux/
          chmod +x release/YataiDON-Linux/YataiDON

          # FFmpeg, SDL3 and the audio codecs are static; only libsndfile's
          # samplerate/mpg123 and libnfc still ship as shared libraries.
          mkdir -p release/YataiDON-Linux/lib
          ldd build/bin/YataiDON | awk '$2 == "=>" && $3 ~ /^\// {print $3}' | \
            grep -E '/(libsamplerate|libmpg123|libmp3lame|libnfc)\.so' | \
            xargs -r -I{} cp -L {} release/YataiDON-Linux/lib/

          # libnfc and its dependency tree, excluding the host's glibc/loader.
          nfc_library=$(ldd build/bin/YataiDON | awk '$1 ~ /^libnfc\.so/ && $2 == "=>" {print $3}')
          if [ -n "$nfc_library" ]; then
            nfc_dependencies=$(ldd "$nfc_library")
            if grep -q 'not found' <<< "$nfc_dependencies"; then
              echo "Unresolved libnfc dependencies:" >&2
              echo "$nfc_dependencies" >&2
              exit 1
            fi
            while IFS= read -r dependency; do
              cp -L "$dependency" release/YataiDON-Linux/lib/
            done < <(awk '$2 == "=>" && $3 ~ /^\// && $1 !~ /^lib(c|m|dl|rt|pthread|resolv|util|anl|nsl)\.so/ {print $3}' <<< "$nfc_dependencies")
          fi

          # Patch rpath: binary looks in $ORIGIN/lib, bundled .so files look in $ORIGIN
          patchelf --set-rpath '$ORIGIN/lib' release/YataiDON-Linux/YataiDON
          for so in release/YataiDON-Linux/lib/*.so*; do
            [ -f "$so" ] && patchelf --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

      - name: Upload Linux package
        uses: actions/upload-artifact@v4
        with:
          name: YataiDON-Linux
          path: release/YataiDON-Linux/
          if-no-files-found: error

  build-windows:
    name: Build on Windows
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Configure Git credentials
        shell: bash
        run: |
          git config --global url."https://${{ secrets.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}@ese.tjadataba.se/".insteadOf "https://ese.tjadataba.se/"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clone skins
        run: |
          for s in PyTaikoGreen YataiDONRed YataiDONNijiiro; do
            git clone --depth 1 https://ese.tjadataba.se/Yonokid/$s.git Skins/$s
          done

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cppwinrt
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-libsndfile
            mingw-w64-x86_64-libsamplerate
            mingw-w64-x86_64-lua
            mingw-w64-x86_64-sdl3
            mingw-w64-x86_64-ffmpeg
            git
            make

      - name: Configure CMake
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=g++ \
            -DCMAKE_C_COMPILER=gcc \
            -DNETWORK_URL="${{ secrets.NETWORK_URL }}" \
            -DNETWORK_AUTH_KEY="${{ secrets.NETWORK_AUTH_KEY }}"

      - name: Build
        run: cmake --build build --config Release

      - name: Prepare release package
        run: |
          mkdir -p release/YataiDON-Windows
          cp build/bin/YataiDON.exe release/YataiDON-Windows/
          cp build/bin/*.dll release/YataiDON-Windows/ 2>/dev/null || true
          cp -r Skins release/YataiDON-Windows/
          cp -r shader release/YataiDON-Windows/
          cp -r Songs release/YataiDON-Windows/

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: YataiDON-Windows
          path: release/YataiDON-Windows/
          if-no-files-found: error

  build-macos:
    name: Build on macOS
    runs-on: macos-26

    steps:
      - name: Select Xcode 26.6
        run: sudo xcode-select --switch /Applications/Xcode_26.6.app/Contents/Developer

      - name: Configure Git credentials
        run: |
          git config --global credential.helper ""
          git config --global url."https://${{ secrets.GITEA_USER }}:${{ secrets.GITEA_TOKEN }}@ese.tjadataba.se/".insteadOf "https://ese.tjadataba.se/"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Clone skins
        run: |
          for s in PyTaikoGreen YataiDONRed YataiDONNijiiro; do
            git clone --depth 1 https://ese.tjadataba.se/Yonokid/$s.git Skins/$s
          done

      - name: Install dependencies
        run: |
          brew install \
            cmake \
            ninja \
            pkg-config \
            ffmpeg \
            sdl3 \
            libogg \
            libvorbis \
            flac \
            opus \
            lame \
            mpg123 \
            speex \
            libsndfile \
            libidn2

      - name: Configure CMake
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix)/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_PREFIX_PATH="$(brew --prefix)" \
            -DCMAKE_EXE_LINKER_FLAGS="-L$(brew --prefix)/lib" \
            -DNETWORK_URL="${{ secrets.NETWORK_URL }}" \
            -DNETWORK_AUTH_KEY="${{ secrets.NETWORK_AUTH_KEY }}"

      - name: Build
        run: cmake --build build --config Debug

      - name: Prepare release package
        run: |
          mkdir -p release/YataiDON-macOS
          cp build/bin/YataiDON release/YataiDON-macOS/
          cp -r Skins release/YataiDON-macOS/
          cp -r shader release/YataiDON-macOS/
          cp -r Songs release/YataiDON-macOS/
          chmod +x release/YataiDON-macOS/YataiDON

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: YataiDON-macOS
          path: release/YataiDON-macOS/
          if-no-files-found: error

  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos]
    if: always()

    steps:
      - name: Check build status
        run: |
          echo "Linux build: ${{ needs.build-linux.result }}"
          echo "Windows build: ${{ needs.build-windows.result }}"
          echo "macOS build: ${{ needs.build-macos.result }}"

          if [[ "${{ needs.build-linux.result }}" != "success" ]] || [[ "${{ needs.build-windows.result }}" != "success" ]] || [[ "${{ needs.build-macos.result }}" != "success" ]]; then
            echo "One or more builds failed!"
            exit 1
          fi

          echo "All builds completed successfully!"
